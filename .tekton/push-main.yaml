# CI on push to main (= merged PR): build -> push image -> bump manifest -> refresh Argo CD
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: hello-main-{{ revision }}
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: >-
      event == "push" && target_branch == "main" &&
      ("app/***".pathChanged() || ".tekton/***".pathChanged())
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: image
      value: image-registry.openshift-image-registry.svc:5000/cicd-demo/hello
  pipelineSpec:
    params:
      - name: repo_url
      - name: revision
      - name: image
    workspaces:
      - name: source
    tasks:
      - name: fetch
        taskRef:
          resolver: cluster
          params:
            - {name: kind, value: task}
            - {name: name, value: git-clone}
            - {name: namespace, value: openshift-pipelines}
        params:
          - {name: URL, value: $(params.repo_url)}
          - {name: REVISION, value: $(params.revision)}
        workspaces:
          - {name: output, workspace: source}

      - name: build
        runAfter: [fetch]
        taskRef:
          resolver: cluster
          params:
            - {name: kind, value: task}
            - {name: name, value: buildah}
            - {name: namespace, value: openshift-pipelines}
        params:
          - {name: IMAGE, value: "$(params.image):$(params.revision)"}
          - {name: CONTEXT, value: app}
          - {name: DOCKERFILE, value: app/Containerfile}
          - name: BUILD_ARGS
            value: ["APP_VERSION=$(params.revision)"]
        workspaces:
          - {name: source, workspace: source}

      - name: update-manifest
        runAfter: [build]
        params:
          - {name: revision, value: $(params.revision)}
        workspaces:
          - {name: source, workspace: source}
        taskSpec:
          params:
            - name: revision
          workspaces:
            - name: source
          steps:
            - name: bump
              image: docker.io/alpine/git:2.47.2
              workingDir: $(workspaces.source.path)
              env:
                - {name: HOME, value: /tmp}
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef: {name: github-token, key: token}
              script: |
                #!/bin/sh
                set -eu
                git config --global --add safe.directory "$PWD"
                git config --global user.name "tekton-bot"
                git config --global user.email "tekton-bot@cicd-demo.local"
                REMOTE=$(git remote get-url origin | sed "s#https://#https://x-access-token:${GITHUB_TOKEN}@#")
                git fetch "$REMOTE" main
                git checkout -B main FETCH_HEAD
                sed -i "s/newTag: .*/newTag: $(params.revision)/" k8s/kustomization.yaml
                git add k8s/kustomization.yaml
                git commit -m "[skip ci] bump hello image to $(params.revision)"
                git push "$REMOTE" main

      - name: argocd-refresh
        runAfter: [update-manifest]
        taskSpec:
          steps:
            - name: refresh
              image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
              script: |
                #!/bin/sh
                oc annotate applications.argoproj.io hello-app -n openshift-gitops \
                  argocd.argoproj.io/refresh=normal --overwrite
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
